<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Agentic Delivery. A Product Owner, engineers, and QA, all agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfe"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3aec2"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="458" rx="28" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="54" font-weight="800" fill="#1e293b">Agentic Delivery</text>
    <text x="600" y="134" font-size="22" fill="#64748b">The rest of your product team, inside Claude Code</text>

    <g transform="translate(110,180)">
      <rect width="280" height="200" rx="20" fill="#ffffff" stroke="#fcd9a8" stroke-width="2"/>
      <circle cx="140" cy="58" r="34" fill="#fff4e0"/>
      <rect x="124" y="40" width="32" height="38" rx="4" fill="none" stroke="#d97706" stroke-width="3.5"/>
      <rect x="132" y="35" width="16" height="9" rx="2" fill="#d97706"/>
      <path d="M130 54h20M130 62h20M130 70h12" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
      <text x="140" y="128" font-size="24" font-weight="700" fill="#b45309">Product Owner</text>
      <text x="140" y="158" font-size="17" fill="#475569">Ready tickets, ordered</text>
      <text x="140" y="182" font-size="17" fill="#475569">backlog, sprint plans</text>
    </g>

    <g transform="translate(460,180)">
      <rect width="280" height="200" rx="20" fill="#ffffff" stroke="#d9cdfb" stroke-width="2"/>
      <circle cx="140" cy="58" r="34" fill="#f1ebfe"/>
      <path d="M126 44l-14 14 14 14M154 44l14 14-14 14M146 40l-12 36" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="140" y="128" font-size="24" font-weight="700" fill="#6d28d9">Engineers</text>
      <text x="140" y="158" font-size="17" fill="#475569">Tests first, a separate</text>
      <text x="140" y="182" font-size="17" fill="#475569">reviewer on every change</text>
    </g>

    <g transform="translate(810,180)">
      <rect width="280" height="200" rx="20" fill="#ffffff" stroke="#b5ead3" stroke-width="2"/>
      <circle cx="140" cy="58" r="34" fill="#e3f8ef"/>
      <path d="M140 34l20 8v14c0 13-9 22-20 26-11-4-20-13-20-26V42z" fill="none" stroke="#059669" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M131 58l7 7 12-13" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="140" y="128" font-size="24" font-weight="700" fill="#047857">QA</text>
      <text x="140" y="158" font-size="17" fill="#475569">Makes sure each test</text>
      <text x="140" y="182" font-size="17" fill="#475569">catches a real bug</text>
    </g>

    <path d="M398 280h54" stroke="#a3aec2" stroke-width="3" marker-end="url(#ar)"/>
    <path d="M748 280h54" stroke="#a3aec2" stroke-width="3" marker-end="url(#ar)"/>

    <rect x="470" y="404" width="260" height="38" rx="19" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="600" y="430" font-size="18" font-weight="700" fill="#4338ca">You're the boss</text>
  </g>
</svg>
