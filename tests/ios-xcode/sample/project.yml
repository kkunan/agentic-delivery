name: Sample
options:
  bundleIdPrefix: dev.agentic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sample:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SampleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Sample
schemes:
  Sample:
    build:
      targets:
        Sample: all
        SampleTests: [test]
    test:
      config: Debug
      targets:
        - SampleTests
