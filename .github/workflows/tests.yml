name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          command -v bash && bash --version | head -1
          /bin/bash --version | head -1
          /usr/bin/python3 --version
          swift --version 2>&1 | head -1
          xcodebuild -version

      - name: Run the tests
        run: bash tests/run-all.sh
