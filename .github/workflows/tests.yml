name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          command -v bash && bash --version | head -1
          /bin/bash --version | head -1
          /usr/bin/python3 --version
          swift --version 2>&1 | head -1
          xcodebuild -version

      - name: Run the tests
        run: bash tests/run-all.sh

  xcode:
    name: iOS layer on real Xcode
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run the iOS commands and the mutation runner
        run: bash tests/ios-xcode/check.sh "$RUNNER_TEMP/ios-xcode"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-evidence
          path: ${{ runner.temp }}/ios-xcode/evidence
          if-no-files-found: warn
